spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
identity:
  jwt:
    issuer: ${JWT_ISSUER}
    audience: ${JWT_AUDIENCE}
    key-id: ${JWT_KEY_ID}
    private-key: ${JWT_PRIVATE_KEY_LOCATION}
    public-key: ${JWT_PUBLIC_KEY_LOCATION}
server:
  forward-headers-strategy: none
