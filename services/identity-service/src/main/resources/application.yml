spring:
  application:
    name: IDENTITY-SERVICE
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/identity_db?connectionTimeZone=UTC}
    username: ${DB_USERNAME:identity}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 10
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
  jackson:
    deserialization:
      fail-on-unknown-properties: true
server:
  port: ${PORT:8081}
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
identity:
  jwt:
    issuer: ${JWT_ISSUER:http://localhost:8081}
    audience: ${JWT_AUDIENCE:ecomm-api}
    key-id: ${JWT_KEY_ID:identity-1}
    private-key: ${JWT_PRIVATE_KEY_LOCATION:file:./.local/keys/private.pem}
    public-key: ${JWT_PUBLIC_KEY_LOCATION:file:./.local/keys/public.pem}
    access-ttl: ${JWT_ACCESS_TTL:PT15M}
    refresh-ttl: ${JWT_REFRESH_TTL:P7D}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
springdoc:
  swagger-ui:
    persist-authorization: false
